name: CI

on:
  push:
    branches: [main, anmol]
  pull_request:

# A newer push to the same ref cancels the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_FROZEN: "1" # `uv run` must never touch uv.lock
  # Same paths the Docker image uses; both caches are restored by actions/cache below.
  FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.cache/fastembed
  TREE_SITTER_LANGUAGE_PACK_CACHE_DIR: ${{ github.workspace }}/.cache/grammars

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gitguru_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gitguru_test
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gitguru_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gitguru_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.21" # keep in sync with backend/Dockerfile
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      # Models and grammars download on first use. Bump the `v1` if EMBED_MODEL or RERANK_MODEL change.
      - uses: actions/cache@v4
        with:
          path: ${{ env.FASTEMBED_CACHE_PATH }}
          key: fastembed-v1-jina-embeddings-v2-base-code-ms-marco-MiniLM-L-6-v2
      - uses: actions/cache@v4
        with:
          path: ${{ env.TREE_SITTER_LANGUAGE_PACK_CACHE_DIR }}
          key: grammars-${{ hashFiles('backend/uv.lock') }}
          restore-keys: grammars-
      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen # Python version comes from backend/.python-version
      - name: pytest (includes the eval quality gate)
        working-directory: backend
        run: uv run pytest -q

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gitguru_test
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gitguru_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gitguru_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.21"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/cache@v4
        with:
          path: ${{ env.FASTEMBED_CACHE_PATH }}
          key: fastembed-v1-jina-embeddings-v2-base-code-ms-marco-MiniLM-L-6-v2
      - uses: actions/cache@v4
        with:
          path: ${{ env.TREE_SITTER_LANGUAGE_PACK_CACHE_DIR }}
          key: grammars-${{ hashFiles('backend/uv.lock') }}
          restore-keys: grammars-
      - name: Install backend (Playwright starts it with `uv run`)
        working-directory: backend
        run: uv sync --frozen
      - name: Install web
        working-directory: web
        run: npm ci
      - name: Typecheck
        working-directory: web
        # PageProps/LayoutProps and next-env.d.ts are generated (gitignored); create them before tsc.
        run: npx next typegen && npx tsc --noEmit
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Unit tests
        working-directory: web
        run: npm test
      - name: Extension unit tests
        run: node --test extension/lib/github.test.js
      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      # extension.spec.ts launches chromium with --headless=new, so no display (xvfb) is needed.
      - name: Playwright
        working-directory: web
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          if-no-files-found: ignore

  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1 # pinned release binary (gitleaks-action is not used)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan the full history
      - name: Install gitleaks (checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tar_file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -O "$base/$tar_file" -O "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $tar_file\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$tar_file" gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Scan the whole history
        run: gitleaks git --redact --verbose --exit-code 1 .

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMAGE: gitguru-api:ci
      # The container runs with --network host, so the service is on localhost.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gitguru
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gitguru
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gitguru"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Grammars are baked in (makes no network call)
        run: |
          out=$(docker run --rm "$IMAGE" python -c "from tree_sitter_language_pack import downloaded_languages as d; print(sorted(d()))")
          echo "$out"
          for lang in python javascript typescript tsx go java rust c cpp ruby php; do
            echo "$out" | grep -q "'$lang'" || { echo "::error::grammar missing: $lang"; exit 1; }
          done
      - name: Start the container offline (models must come from the image)
        run: |
          docker run -d --name api --network host \
            -e DATABASE_URL -e LLM_CHAIN=fake -e HF_HUB_OFFLINE=1 "$IMAGE"
      - name: Wait for /health
        run: |
          for i in $(seq 30); do
            curl -fsS http://localhost:7860/health && exit 0
            sleep 2
          done
          echo "::error::/health did not answer within 60 s"
          docker logs api
          exit 1
      - name: A guest page job reaches ready
        run: |
          id=$(curl -fsS -X POST http://localhost:7860/pages -H 'content-type: application/json' \
            -d '{"url":"https://example.com/smoke","title":"Smoke","text":"GitGuru indexes pages and code so you can ask questions and get cited answers."}' \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['repo_id'])")
          for i in $(seq 60); do
            status=$(curl -fsS http://localhost:7860/repos \
              | python3 -c "import json,sys; print(next(r['status'] for r in json.load(sys.stdin) if r['id'] == $id))")
            echo "repo $id: $status"
            [ "$status" = ready ] && exit 0
            [ "$status" = failed ] && break
            sleep 2
          done
          echo "::error::page job did not reach ready"
          docker logs api
          exit 1
      - name: Container logs
        if: always()
        run: docker logs api || true
