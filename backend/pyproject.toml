[project]
name = "gitguru"
version = "0.1.0"
description = "Talk to any codebase: RAG over GitHub repos with cited answers."
readme = "README.md"
authors = [
    { name = "Anmol", email = "anmol26rajput@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "fastembed>=0.8.1",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "openai>=3.22.1",
    "pgvector>=0.5.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "tree-sitter-language-pack>=1.20.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
gitguru = "gitguru.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gitguru"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
