<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GitGuru options</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    main { max-width: 420px; margin: 32px auto; padding: 0 16px; }
    h1 { font-size: 18px; margin: 0 0 16px; }
    label { display: block; font-weight: 600; margin-bottom: 4px; }
    input { width: 100%; padding: 8px 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
    .row { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
    #status { font-size: 13px; color: var(--muted); }
    #status.err { color: var(--danger-text); }
    .note { margin-top: 20px; font-size: 13px; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1><span style="color: var(--accent-text)" aria-hidden="true">&#9670;</span> GitGuru options</h1>
    <form id="form">
      <label for="url">Web app URL</label>
      <input id="url" type="url" required placeholder="http://localhost:3000">
      <div class="row">
        <button class="key" type="submit">Save</button>
        <span id="status" role="status"></span>
      </div>
    </form>
    <p class="note">No token needed. The owner token (only needed to delete repos and to skip the daily limits) goes in the panel's Settings.</p>
  </main>
  <script src="options.js"></script>
</body>
</html>
